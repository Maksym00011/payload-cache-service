[project]
name = "payload-cache-service"
version = "0.1.0"
description = "FastAPI microservice that caches transformed strings and interleaves them into payloads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    # SQLModel pulls in SQLAlchemy, but not its asyncio extra: without
    # greenlet the async engine refuses to start.
    "sqlalchemy[asyncio]>=2.0.36",
    "pydantic-settings>=2.6.0",
    # Async drivers: SQLite is the zero-setup default, PostgreSQL the
    # production path. Both are supported through the same DATABASE_URL.
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    # Used by the CLI, and by the test suite to drive the ASGI app directly.
    "httpx>=0.28.0",
]

[project.scripts]
cache-cli = "cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8 naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async gotchas (blocking calls in coroutines)
    "T20",       # no stray print()
    "RET",       # return-flow smells
    "PTH",       # pathlib over os.path
    "ARG",       # unused arguments
    "PL",        # pylint subset
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literals and may take fixtures they do not reference directly.
"tests/**" = ["PLR2004", "ARG001"]
# The CLI writes to stdout by design.
"cli/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Decorator-heavy test helpers are not worth annotating to strict standards.
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: end-to-end tests that spawn a real server process",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
